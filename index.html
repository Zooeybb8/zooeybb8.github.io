<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nature Kingdom 庫存掃描</title>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #7EC8A4;
    --accent-dim: rgba(126,200,164,0.12);
    --in: #4CAF81;
    --in-dim: rgba(76,175,129,0.12);
    --out: #E07B5A;
    --out-dim: rgba(224,123,90,0.12);
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  .header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .header .logo { width: 28px; height: 28px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .sync-status { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
  .sync-dot.ok { background: var(--in); }

  .main { padding: 20px; max-width: 480px; margin: 0 auto; }

  .scanner-card {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px;
  }
  .scanner-header {
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .scanner-title { font-size: 14px; font-weight: 600; }
  .scan-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 7px 16px; border-radius: 20px;
    border: none; background: var(--accent); color: #0f0f0f;
    font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  .scan-btn:hover { opacity: 0.85; }

  #scanner-container {
    width: 100%; background: #000; position: relative; display: none;
    aspect-ratio: 4/3; overflow: hidden;
  }
  #scannerVideo {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .scan-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 2;
  }
  .scan-frame {
    width: 65%; aspect-ratio: 3/1;
    border: 2px solid var(--accent);
    border-radius: 6px;
    box-shadow: 0 0 0 1000px rgba(0,0,0,0.45);
  }
  .scan-line {
    position: absolute; width: 63%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scanline 1.8s ease-in-out infinite;
  }
  @keyframes scanline { 0%,100% { top: 32%; } 50% { top: 68%; } }

  .manual-input {
    padding: 14px 16px; display: flex; gap: 8px; border-top: 1px solid var(--border);
  }
  .manual-input input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .manual-input input:focus { border-color: var(--accent); }
  .manual-input input::placeholder { color: var(--text3); }
  .search-btn {
    padding: 9px 16px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text2); cursor: pointer; font-size: 13px;
    transition: all 0.2s;
  }
  .search-btn:hover { border-color: var(--accent); color: var(--accent); }

  .product-card {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); margin-bottom: 16px; display: none;
  }
  .product-info { padding: 16px; border-bottom: 1px solid var(--border); }
  .product-badge {
    display: inline-block; font-size: 11px; padding: 3px 8px;
    border-radius: 4px; background: var(--accent-dim); color: var(--accent);
    margin-bottom: 8px; font-weight: 500;
  }
  .product-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .product-meta { font-size: 13px; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; }
  .product-stock {
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .stock-label { font-size: 13px; color: var(--text2); }
  .stock-num { font-size: 24px; font-weight: 700; color: var(--text); }

  .action-section { padding: 16px; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 14px;
    font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .type-btn.in.active { background: var(--in-dim); border-color: var(--in); color: var(--in); }
  .type-btn.out.active { background: var(--out-dim); border-color: var(--out); color: var(--out); }

  .qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .qty-label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .qty-ctrl { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .qty-ctrl button {
    width: 44px; height: 44px; background: var(--surface2); border: none;
    color: var(--text); font-size: 18px; cursor: pointer; transition: background 0.15s;
  }
  .qty-ctrl button:active { background: var(--border); }
  .qty-ctrl input {
    width: 64px; height: 44px; background: transparent; border: none;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    color: var(--text); font-size: 16px; font-weight: 600; text-align: center; outline: none;
  }

  .note-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px;
    outline: none; margin-bottom: 14px; transition: border-color 0.2s;
  }
  .note-input:focus { border-color: var(--accent); }
  .note-input::placeholder { color: var(--text3); }

  .confirm-btn {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    background: var(--in); color: #0f0f0f;
  }
  .confirm-btn:active { opacity: 0.8; }
  .confirm-btn:disabled { opacity: 0.4; cursor: default; }
  .confirm-btn.out { background: var(--out); }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 20px; font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 100;
    transition: transform 0.3s ease; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--in); color: var(--in); }
  .toast.error { border-color: var(--out); color: var(--out); }

  .records-card {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); margin-bottom: 20px;
  }
  .records-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; }
  .record-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .record-item:last-child { border-bottom: none; }
  .record-left { flex: 1; min-width: 0; }
  .record-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .record-qty { font-size: 16px; font-weight: 700; }
  .record-qty.in { color: var(--in); }
  .record-qty.out { color: var(--out); }
  .empty-records { padding: 24px; text-align: center; color: var(--text3); font-size: 13px; }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(15,15,15,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text2); }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">載入產品資料中…</div>
</div>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="logo">🌿</div>
    <h1>庫存掃描</h1>
  </div>
  <div class="sync-status">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncText">連線中</span>
  </div>
</div>

<div class="main">

  <div class="scanner-card">
    <div class="scanner-header">
      <span class="scanner-title">掃描條碼</span>
      <button class="scan-btn" id="scanBtn" onclick="toggleScanner()">
        <span>📷</span> 開始掃描
      </button>
    </div>
    <div id="scanner-container">
      <video id="scannerVideo" autoplay playsinline muted></video>
      <div class="scan-overlay">
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="manual-input">
      <input type="text" id="barcodeInput" placeholder="或輸入條碼 / SKU / 品名…"
        onkeydown="if(event.key==='Enter')searchBarcode()" />
      <button class="search-btn" onclick="searchBarcode()">查詢</button>
    </div>
  </div>

  <div class="product-card" id="productCard">
    <div class="product-info">
      <div class="product-badge" id="productBrand">—</div>
      <div class="product-name" id="productName">—</div>
      <div class="product-meta">
        <span id="productSku">—</span>
        <span id="productSize">—</span>
        <span id="productCat">—</span>
      </div>
    </div>
    <div class="product-stock">
      <div>
        <div class="stock-label">目前庫存</div>
        <div class="stock-num" id="stockNum">—</div>
      </div>
      <div style="text-align:right;">
        <div class="stock-label">售價</div>
        <div style="font-size:16px;font-weight:600;color:var(--accent);" id="productPrice">—</div>
      </div>
    </div>
    <div class="action-section">
      <div class="type-toggle">
        <button class="type-btn in active" id="btnIn" onclick="setType('in')">＋ 進貨</button>
        <button class="type-btn out" id="btnOut" onclick="setType('out')">－ 出貨</button>
      </div>
      <div class="qty-row">
        <span class="qty-label">數量</span>
        <div class="qty-ctrl">
          <button onclick="changeQty(-1)">−</button>
          <input type="number" id="qtyInput" value="1" min="1" max="999" />
          <button onclick="changeQty(1)">＋</button>
        </div>
      </div>
      <input class="note-input" type="text" id="noteInput" placeholder="備註（選填）" />
      <button class="confirm-btn" id="confirmBtn" onclick="confirmAction()">確認進貨</button>
    </div>
  </div>

  <div class="records-card">
    <div class="records-header">最近記錄</div>
    <div id="recordsList">
      <div class="empty-records">還沒有記錄</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxKDVgPwew57TjEsUTxWvfWSVR3MBkJYQKFPn1CZFdCbwcgZF9KA7weAAvObxKiHSnR/exec';

let products = [];
let currentProduct = null;
let actionType = 'in';
let scanning = false;
let recentRecords = [];
let codeReader = null;

// ── Load Products ──
async function loadProducts() {
  try {
    const res = await fetch(`${API_URL}?action=getProducts`);
    const data = await res.json();
    products = data.products || [];
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('syncDot').classList.add('ok');
    document.getElementById('syncText').textContent = `${products.length} 筆產品`;
    showToast(`已載入 ${products.length} 筆產品`, 'success');
  } catch(e) {
    document.querySelector('.loading-text').textContent = '載入失敗，請重新整理頁面';
    showToast('連線失敗', 'error');
  }
}

// ── Search ──
function searchBarcode(code) {
  const q = (code || document.getElementById('barcodeInput').value || '').trim();
  if (!q) return;
  const found = products.find(p => p.barcode === q || p.sku === q) ||
    products.find(p => p.name.toLowerCase().includes(q.toLowerCase()));
  if (!found) { showToast('找不到此商品', 'error'); return; }
  showProduct(found);
}

function showProduct(p) {
  currentProduct = p;
  document.getElementById('productBrand').textContent = p.brand || '—';
  document.getElementById('productName').textContent = p.name;
  document.getElementById('productSku').textContent = p.sku;
  document.getElementById('productSize').textContent = p.size;
  document.getElementById('productCat').textContent = p.category;
  document.getElementById('stockNum').textContent = p.stock;
  document.getElementById('productPrice').textContent = p.price ? `NT$${parseInt(p.price).toLocaleString()}` : '—';
  document.getElementById('qtyInput').value = 1;
  document.getElementById('noteInput').value = '';
  document.getElementById('productCard').style.display = 'block';
  setType('in');
  document.getElementById('productCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Type Toggle ──
function setType(t) {
  actionType = t;
  document.getElementById('btnIn').classList.toggle('active', t === 'in');
  document.getElementById('btnOut').classList.toggle('active', t === 'out');
  const btn = document.getElementById('confirmBtn');
  btn.textContent = t === 'in' ? '確認進貨' : '確認出貨';
  btn.classList.toggle('out', t === 'out');
}

function changeQty(d) {
  const el = document.getElementById('qtyInput');
  el.value = Math.max(1, (parseInt(el.value)||1) + d);
}

// ── Confirm ──
async function confirmAction() {
  if (!currentProduct) return;
  const qty = parseInt(document.getElementById('qtyInput').value) || 1;
  const note = document.getElementById('noteInput').value;
  const delta = actionType === 'in' ? qty : -qty;
  if (currentProduct.stock + delta < 0) { showToast('庫存不足', 'error'); return; }

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = '更新中…';

  try {
    const params = new URLSearchParams({
      action: 'record',
      type: actionType,
      sku: currentProduct.sku,
      delta: delta,
      note: note
    });
    const res = await fetch(`${API_URL}?${params}`);
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); }
    else {
      currentProduct.stock = data.newStock;
      document.getElementById('stockNum').textContent = data.newStock;
      const now = new Date();
      const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
      recentRecords.unshift({ name: currentProduct.name, delta, time: timeStr });
      if (recentRecords.length > 10) recentRecords.pop();
      renderRecords();
      showToast(`${actionType === 'in' ? '進貨' : '出貨'} ${qty} 件完成`, 'success');
      document.getElementById('barcodeInput').value = '';
    }
  } catch(e) {
    showToast('更新失敗：' + e.message, 'error');
  }
  btn.disabled = false;
  setType(actionType);
}

// ── Records ──
function renderRecords() {
  const el = document.getElementById('recordsList');
  if (!recentRecords.length) { el.innerHTML = '<div class="empty-records">還沒有記錄</div>'; return; }
  el.innerHTML = recentRecords.map(r => `
    <div class="record-item">
      <div class="record-left">
        <div class="record-name">${r.name}</div>
        <div class="record-time">${r.time}</div>
      </div>
      <div class="record-qty ${r.delta > 0 ? 'in' : 'out'}">${r.delta > 0 ? '+' : ''}${r.delta}</div>
    </div>`).join('');
}

// ── Scanner (ZXing) ──
function toggleScanner() {
  scanning ? stopScanner() : startScanner();
}

async function startScanner() {
  scanning = true;
  document.getElementById('scanner-container').style.display = 'block';
  document.getElementById('scanBtn').innerHTML = '⏹ 停止';

  try {
    codeReader = new ZXing.BrowserMultiFormatReader(null, 200);

    // 取得後鏡頭 deviceId
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');
    const backCamera = videoDevices.find(d => /back|rear|environment/i.test(d.label)) || videoDevices[videoDevices.length - 1];
    const deviceId = backCamera ? backCamera.deviceId : undefined;

    await codeReader.decodeFromVideoDevice(deviceId, 'scannerVideo', (result, err) => {
      if (result) {
        const code = result.getText();
        stopScanner();
        document.getElementById('barcodeInput').value = code;
        searchBarcode(code);
        if (navigator.vibrate) navigator.vibrate(80);
      }
    });

    // 嘗試啟用連續自動對焦（不強制高解析度，避免干擾掃描）
    const videoEl = document.getElementById('scannerVideo');
    if (videoEl.srcObject) {
      const track = videoEl.srcObject.getVideoTracks()[0];
      if (track) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    }
  } catch(e) {
    showToast('無法啟動相機：' + e.message, 'error');
    stopScanner();
  }
}

function stopScanner() {
  if (codeReader) {
    codeReader.reset();
    codeReader = null;
  }
  // 手動釋放 stream，避免相機燈號殘留
  const videoEl = document.getElementById('scannerVideo');
  if (videoEl.srcObject) {
    videoEl.srcObject.getTracks().forEach(t => t.stop());
    videoEl.srcObject = null;
  }
  scanning = false;
  document.getElementById('scanner-container').style.display = 'none';
  document.getElementById('scanBtn').innerHTML = '<span>📷</span> 開始掃描';
}

// ── Toast ──
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type}`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Init ──
loadProducts();
</script>
</body>
</html>
